<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Cadastro</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <h1 id="titulo">Cadastro</h1>

    <div class="menu">
        <a href="#">Início</a>
        <a href="#">Sobre</a>
        <a href="#">Contato</a>
    </div>

    <div class="box-formulario">
        <form id="formulario">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" class="input-text" placeholder="Digite seu nome">

            <label for="email">Email:</label>
            <input type="email" id="email" class="input-text" placeholder="Digite seu email">

            <label for="senha">Senha:</label>
            <input type="password" id="senha" class="input-text" placeholder="Digite sua senha">

            <input type="submit" value="Cadastrar" class="botao">
        </form>
    </div>

</body>
</html>
